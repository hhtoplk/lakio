
name: Delete All Workflow Runs

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Confirm deletion of all completed workflow runs"
        required: true
        type: boolean
        default: false

permissions:
  actions: write

jobs:
  delete-runs:
    if: github.ref == 'refs/heads/main' && inputs.confirm == true
    runs-on: ubuntu-latest

    steps:
      - name: Delete all completed workflow runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          python3 <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          current = int(os.environ["CURRENT_RUN_ID"])

          base = f"https://api.github.com/repos/{repo}/actions/runs"

          def request(url, method="GET"):
              req = urllib.request.Request(
                  url,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28"
                  }
              )
              with urllib.request.urlopen(req) as response:
                  return response.read()

          deleted = 0
          skipped = 0
          page = 1

          while True:
              data = json.loads(
                  request(f"{base}?per_page=100&page={page}")
              )

              runs = data.get("workflow_runs", [])

              if not runs:
                  break

              for run in runs:
                  run_id = run["id"]

                  if run_id == current:
                      skipped += 1
                      continue

                  if run["status"] != "completed":
                      skipped += 1
                      continue

                  try:
                      request(f"{base}/{run_id}", "DELETE")
                      deleted += 1
                      print(f"Deleted run: {run_id}")

                  except urllib.error.HTTPError as error:
                      print(f"Could not delete {run_id}: {error.code}")

              if len(runs) < 100:
                  break

              page += 1

          print("--------------------------------")
          print(f"Total deleted: {deleted}")
          print(f"Total skipped: {skipped}")
          print("Cleanup completed.")
          PY
