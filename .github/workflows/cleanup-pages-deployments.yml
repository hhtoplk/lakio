
name: Cleanup GitHub Pages Deployment History

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Confirm deletion of old inactive GitHub Pages deployments"
        required: true
        type: boolean
        default: false

permissions:
  deployments: write

jobs:
  cleanup:
    if: github.ref == 'refs/heads/main' && inputs.confirm == true
    runs-on: ubuntu-latest

    steps:
      - name: Delete old inactive Pages deployments only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 <<'PY'
          import os
          import json
          import time
          import urllib.request
          import urllib.error

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]

          base = f"https://api.github.com/repos/{repo}"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28"
          }

          def api(url, method="GET"):
              req = urllib.request.Request(
                  url,
                  headers=headers,
                  method=method
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  body = response.read()
                  if not body:
                      return None
                  return json.loads(body)

          print("Fetching GitHub Pages deployments...")

          deployments = []
          page = 1

          while True:
              url = (
                  f"{base}/deployments"
                  f"?environment=github-pages"
                  f"&per_page=100&page={page}"
              )

              items = api(url)

              if not items:
                  break

              deployments.extend(items)

              if len(items) < 100:
                  break

              page += 1

          print(f"Total Pages deployments found: {len(deployments)}")

          if not deployments:
              print("No deployments found.")
              raise SystemExit(0)

          # Always preserve the newest deployment.
          newest_id = deployments[0]["id"]

          deleted = 0
          preserved = 0
          failed = 0

          for deployment in deployments:
              deployment_id = deployment["id"]

              # Never delete the newest deployment.
              if deployment_id == newest_id:
                  print(f"KEEP newest deployment: {deployment_id}")
                  preserved += 1
                  continue

              # Check the latest status of this deployment.
              status_url = (
                  f"{base}/deployments/{deployment_id}/statuses"
                  f"?per_page=1"
              )

              try:
                  statuses = api(status_url)

                  if not statuses:
                      print(f"KEEP no status: {deployment_id}")
                      preserved += 1
                      continue

                  state = statuses[0].get("state", "").lower()

                  # Delete only deployments explicitly marked inactive.
                  if state != "inactive":
                      print(
                          f"KEEP deployment {deployment_id}: "
                          f"status={state}"
                      )
                      preserved += 1
                      continue

                  # Recheck status immediately before deletion.
                  latest = api(status_url)

                  if (
                      not latest
                      or latest[0].get("state", "").lower() != "inactive"
                  ):
                      print(f"KEEP changed status: {deployment_id}")
                      preserved += 1
                      continue

                  api(
                      f"{base}/deployments/{deployment_id}",
                      method="DELETE"
                  )

                  deleted += 1
                  print(f"DELETED inactive deployment: {deployment_id}")

                  time.sleep(0.2)

              except urllib.error.HTTPError as error:
                  failed += 1
                  print(
                      f"FAILED deployment {deployment_id}: "
                      f"HTTP {error.code}"
                  )

              except Exception as error:
                  failed += 1
                  print(f"ERROR {deployment_id}: {error}")

          print("")
          print("========== CLEANUP SUMMARY ==========")
          print(f"Total found: {len(deployments)}")
          print(f"Deleted: {deleted}")
          print(f"Preserved: {preserved}")
          print(f"Failed: {failed}")
          print("=====================================")
          PY
